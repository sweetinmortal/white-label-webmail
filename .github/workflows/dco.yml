name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check-sign-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            if ! git log -1 --format=%B "$sha" | grep -Eiq '^Signed-off-by: .+ <[^>]+>[[:space:]]*$'; then
              echo "::error::Commit $sha is missing a valid Signed-off-by line."
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..refs/remotes/origin/pr-head")

          if [ "$missing" -ne 0 ]; then
            echo "All commits must be signed off. Use: git commit -s"
            exit 1
          fi

          echo "All commits are signed off."
